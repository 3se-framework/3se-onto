name: Validate glossary entries

on:
  workflow_dispatch:
  push:
    paths:
      - "terms/**.json"
      - "references/**.json"
      - "properties/**.json"
      - "domains/**.json"
      - "axioms/**"
      - "scripts/generate_prolog.py"

jobs:
  validate:
    name: Validate glossary elements, inject attributes & commit
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the injected missing data back

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0  # full history required for inject_dates and inject_contributors

      - name: Ensure required directories exist
        run: |
          mkdir -p terms references properties domains
          git add terms references properties domains

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Validation (runs first, blocks everything if it fails) ──

      - name: Validate all entries
        run: python scripts/validate_glossary.py

      # ── Check consistency (runs only if validation passed) ──

      - name: Check inheritance consistency
        run: python scripts/check_inheritance.py

      # ── Injection (runs only if validation passed) ──

      - name: Inject UUIDs and rename files
        run: python scripts/inject_uuids.py

      - name: Inject missing IDs
        run: python scripts/inject_ids.py

      - name: Inject shape ids
        run: python scripts/inject_shape_ids.py

      - name: Inject relational URIs
        run: python scripts/inject_uris.py

      - name: Inject 3SE internal links
        run: python scripts/inject_3se_links.py

      - name: Inject analysis role links
        run: python scripts/inject_analysis_roles.py

      - name: Inject isResponsibleFor targets
        run: python scripts/inject_responsible_roles.py

      - name: Inject created/updated dates
        run: python scripts/inject_dates.py

      - name: Inject contributors
        run: python scripts/inject_contributors.py

      # ── Commit enriched fields back ──

      - name: Collect changed files
        id: changed
        run: |
          patterns=""
          for dir in terms references properties domains; do
            if compgen -G "$dir/*.json" > /dev/null 2>&1; then
              patterns="$patterns $dir/*.json"
            fi
          done
          echo "file_pattern=${patterns# }" >> $GITHUB_OUTPUT

      - name: Commit injected fields (if any)
        if: steps.changed.outputs.file_pattern != ''
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "main: inject missing ids, dates and contributors [skip ci]"
          file_pattern: ${{ steps.changed.outputs.file_pattern }}

      # ── Prolog axioms (after the commit, so the injected fields are kept even if this fails) ──

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox

      - name: Generate Prolog facts
        run: python scripts/generate_prolog.py

      - name: Check axioms
        # check/0 prints every violation and warning and fails on any violation
        run: swipl -q -g check -t halt axioms/load.pl
